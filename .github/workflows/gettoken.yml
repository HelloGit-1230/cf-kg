name: 扫码获取账号串
on:
  workflow_dispatch:
    inputs:
      remark:
        description: "账号备注"
        required: false
        default: "我的号"
permissions:
  contents: write
jobs:
  gettoken:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: 生成二维码
        run: |
          python3 -m pip install --quiet qrcode
          python3 scripts/kglogin.py --create --session qr_session.json
      - name: 发布二维码
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/qrimg && cp scripts/kg_login_qr.png /tmp/qrimg/qr.png
          cd /tmp/qrimg
          git init -q -b qr-image
          git add qr.png
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" commit -qm "qr $(date +%s)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" qr-image
          SHA=$(git rev-parse HEAD)
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/qr.png"
          echo "## 扫码二维码（约2分钟有效）" >> "$GITHUB_STEP_SUMMARY"
          echo "![二维码](${URL})" >> "$GITHUB_STEP_SUMMARY"
      - name: 等待扫码并输出账号串
        env:
          REMARK: ${{ inputs.remark }}
        run: |
          python3 scripts/kglogin.py --poll --session qr_session.json --seconds 150 --remark "$REMARK" --out kg_account.txt
          echo "## 账号串（复制保存，勿外发）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat kg_account.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
